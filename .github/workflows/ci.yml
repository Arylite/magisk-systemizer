name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck 0.11.0 (pinned, because the runner image ships an older one)
        run: |
          curl -fsSL -o sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  sc.tar.xz" | sha256sum -c -
          tar -xJf sc.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck (module code must be clean)
        run: shellcheck module/lib/*.sh module/system/bin/systemizer module/customize.sh
      - name: ShellCheck (tests, with quoting and style rules relaxed on purpose)
        run: shellcheck -e SC2016,SC2015,SC2086,SC1090,SC1091 tests/*.sh
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  test:
    name: Tests (bash, dash, mksh, busybox ash)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the other shells (Android uses mksh; Magisk ships busybox ash)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox-static
          printf '#!/bin/sh\nexec busybox ash "$@"\n' | sudo tee /usr/local/bin/bbsh > /dev/null
          sudo chmod +x /usr/local/bin/bbsh
      - name: Hygiene and tests under every shell
        run: SHELLS="bash dash mksh bbsh" sh tests/run.sh

  build:
    name: Build the module zip
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build twice and compare (the build must be reproducible)
        run: |
          python build.py --out dist
          python build.py --out dist2
          cmp dist/*.zip dist2/*.zip
          (cd dist && sha256sum ./*.zip | tee SHA256SUMS)
      # Artifact storage can run out on a free account; the build and the reproducibility
      # check above are what matter, and releases attach the zip without this storage.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: module-zip
          retention-days: 7
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
